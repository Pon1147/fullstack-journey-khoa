# CD Pipeline - Deploy to Staging/Production
# Triggers on push to main (production) or dev (staging)

name: CD - Deploy

on:
  push:
    branches:
      - main        # Production deployment
      - dev         # Staging deployment

permissions:
  contents: read
  packages: write

jobs:
  # ==================== Deploy to Environment ====================
  deploy:
    name: Deploy to ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}
    runs-on: ubuntu-latest

    # Set environment variable based on branch
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "name=production" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=latest" >> $GITHUB_OUTPUT
          else
            echo "name=staging" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=staging-${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/frontend
          tags: |
            type=raw,value=${{ steps.env.outputs.IMAGE_TAG }}
            type=sha,prefix=${{ steps.env.outputs.IMAGE_TAG }}-

      - name: Docker metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=${{ steps.env.outputs.IMAGE_TAG }}
            type=sha,prefix=${{ steps.env.outputs.IMAGE_TAG }}-

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./projects/frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./projects/backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==================== Deploy Options (Choose One) ====================

      # Option 1: Deploy to VPS via SSH
      - name: Deploy to VPS (SSH)
        if: false  # Set to true when you have a VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/data-platform
            docker-compose pull
            docker-compose up -d
            docker image prune -f

      # Option 2: Deploy to Railway/Render (API)
      - name: Trigger Railway Deploy
        if: false  # Set to true when using Railway
        run: |
          curl -X POST https://api.railway.app/v1/deploy/${{ secrets.RAILWAY_PROJECT_ID }}/deploy \
            -H "Authorization: ${{ secrets.RAILWAY_TOKEN }}"

      # Option 3: Notify (Always runs)
      - name: Deploy Notification
        run: |
          echo "=========================================="
          echo "Deployment Complete!"
          echo "Environment: ${{ steps.env.outputs.name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "=========================================="

  # ==================== Smoke Tests ====================
  smoke-test:
    name: Post-Deploy Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine target URL
        id: url
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "api_url=${{ secrets.PROD_API_URL || 'https://api.yourdomain.com' }}" >> $GITHUB_OUTPUT
          else
            echo "api_url=${{ secrets.STAGING_API_URL || 'https://staging.yourdomain.com' }}" >> $GITHUB_OUTPUT
          fi

      - name: Health Check
        run: |
          echo "Checking health endpoint..."
          curl -f "${{ steps.url.outputs.api_url }}/health" || exit 1
          echo " ✅ Health check passed"

      - name: API Version Check
        run: |
          echo "Checking API version..."
          curl -f "${{ steps.url.outputs.api_url }}/docs" || exit 1
          echo " ✅ Swagger docs accessible"