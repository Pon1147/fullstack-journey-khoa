# CI Pipeline - Lint & Test
# Triggers on push to main/dev and all Pull Requests

name: CI - Lint & Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ==================== Backend Tests ====================
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: data_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('projects/backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./projects/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov black flake8

      - name: Lint with flake8
        working-directory: ./projects/backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Format check with black
        working-directory: ./projects/backend
        run: |
          black . --check

      - name: Run pytest
        working-directory: ./projects/backend
        env:
          DATABASE_URL: postgresql://admin:password123@localhost:5432/data_platform_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-ci
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: projects/backend/coverage.xml

  # ==================== Frontend Tests ====================
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: projects/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./projects/frontend
        run: npm ci

      - name: Lint with ESLint
        working-directory: ./projects/frontend
        run: npm run lint

      - name: Type check with TypeScript
        working-directory: ./projects/frontend
        run: npm run type-check || true

      - name: Run tests with Vitest
        working-directory: ./projects/frontend
        run: npm run test -- --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: projects/frontend/coverage/

  # ==================== Docker Build Check ====================
  docker-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./projects/frontend
          push: false
          load: true
          tags: frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build backend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./projects/backend
          push: false
          load: true
          tags: backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max